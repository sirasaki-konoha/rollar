[workspace]
members = [
    "crates/roller-cli",
    "crates/roller-diagnostics",
    "crates/roller-parser",
    "crates/roller-transpiler",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
